# SDG&E Schedule EECC matched to TOU-DR1 — GENERATION layer (bundled commodity),
# 4/1/2026 vintage.
#
# Composition, CARE derivation and the CCA/PCIA note: see
# `sdge_tou_dr1_generation_2026-06-01.yaml`, the canonical header.
#
# ⭐ THE EECC VALUES BELOW ARE IDENTICAL TO THE 6/1/2026 SHEET'S. Generation moved on 4/1
# and then held; DELIVERY moved again on 6/1 (UDC Total 0.34061 -> 0.32948) while this
# layer did not. The engine versions the two layers independently, so this is expressible
# rather than a conflict — but it is worth stating plainly, because a tool that models
# "the rate changed on 6/1" as a single event would misprice one layer or the other for
# every bill spanning that date.
#
# SUPER-OFF-PEAK WINDOW is March/April only on this vintage (pre-2026-05-01); the rules
# below are byte-identical to the matching delivery spec's, asserted by test.
#
# PCIA table printed on the 4/1/2026 sheet, by vintage ($/kWh) — identical to the 6/1
# sheet's, and DIFFERENT from the 1/1 sheet's: 2001 Legacy (0.00006), 2009 0.01538,
# 2010 0.02010, 2011 0.03031, 2012 0.03637, 2013 0.03572, 2014 0.03572, 2015 0.03687,
# 2016 0.03595, 2017 0.03576, 2018 0.03670, 2019 0.03450, 2020 0.03605, 2021 0.03564,
# 2022 0.03005, 2023 0.02828, 2024 0.05055, 2025 0.04987, 2026 0.04987.
# CCA-only; not billed by this spec. Recorded for the unauthored CCA overlay.
schedule_id: TOU-DR1
name: SDG&E bundled generation (Schedule EECC) matched to TOU-DR1
provider: SDG&E
layer: generation
effective_date: 2026-04-01
citation: >-
  SDG&E "Schedule TOU-DR1 - Residential Time of Use Service Effective 4/1/2026" Total
  Rates Table, EECC Rate column (sdge.com/sites/default/files/regulatory/4-1-26 Schedule
  TOU-DR1 Total Rates Table.pdf), and the matching "4-1-26 Schedule TOU-DR1-CARE Total
  Rates Table.pdf" for the CARE derivation, both retrieved 2026-09-07. Commodity component
  defined by Schedule EECC; seasons per Schedule EECC. Period definitions per the matching
  delivery spec.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
    - {period: super_off_peak, hours: [[0, 6]], days: weekday}
    - {period: super_off_peak, hours: [[10, 14]], days: weekday, months: [3, 4]}
    - {period: super_off_peak, hours: [[0, 14]], days: weekend}
  default_period: off_peak
  holiday_calendar: sdge_residential
  labels: {on_peak: On-Peak, off_peak: Off-Peak, super_off_peak: Super Off-Peak}

energy:
  summer_on_peak:        {standard: 0.34920, care: 0.2269800}
  summer_off_peak:       {standard: 0.12853, care: 0.0835445}
  summer_super_off_peak: {standard: 0.04121, care: 0.0267865}
  winter_on_peak:        {standard: 0.27475, care: 0.1785875}
  winter_off_peak:       {standard: 0.19304, care: 0.1254760}
  winter_super_off_peak: {standard: 0.10228, care: 0.0664820}

# --- FRANCHISE FEE DIFFERENTIAL on generation (session 32) -------------------------------
# Schedule EECC carries its own 5.78% clause, so a BUNDLED household in the City of San Diego
# pays the differential on its generation as well as on its delivery (the delivery spec's
# line). This is what settled the bundled case TOU-DR1's delivery line used to refuse.
# Consistent with Schedule CCA: a CCA customer pays 6.88% of imputed EECC in the city and
# 1.1% outside it; the 5.78-point difference is this differential.
# NOT on the imputed layer: Schedule CCA imputes EECC's *charges*, and this is a fee on
# them, so compute_bill prices the imputed layer with surcharges=False.
# Not yet checked against a real bundled statement; none exists in this repo.
surcharges:
  - name: City of San Diego Franchise Fee Differential (generation)
    applies_to: bundled
    rate_by_jurisdiction: {city_of_san_diego: 0.0578, other: 0.0}
    of: pretax
    # care: whether the base is before or after the CARE discount is not settled; Schedule
    #   E-CARE says nothing about franchise fees.
    unverified_for: [care]
    citation: >-
      SDG&E Schedule EECC, "Franchise Fees", Sheet 13, Cal. P.U.C. Sheet 30030-E (Advice
      3167-E): "A Franchise Fee Differential of 5.78% will be applied to the total bills
      calculated under this schedule, including DWR charges, for all customers residing
      within the corporate limits of the City of San Diego." Applicability (Sheet 1, Cal.
      P.U.C. Sheet 30018-E): customers receiving UDC bundled service. Retrieved 2026-10-23
      (sdge.com/sites/default/files/elec_elec-scheds_eecc.pdf).
