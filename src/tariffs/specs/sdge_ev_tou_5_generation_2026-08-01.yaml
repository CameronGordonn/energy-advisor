# SDG&E Schedule EECC matched to EV-TOU-5 — GENERATION layer, 8/1/2026 vintage.
#
# Composition and CARE derivation: see the 2026-01-01 spec's header.
#
# ⭐ EECC MOVED ON THIS FILING (the 6/1 one touched delivery only), and on EV-TOU-5 it moved
# further than on any other schedule: summer on-peak 0.47019 -> 0.48396, +0.01377/kWh. Every
# other period rose too — summer off 0.17311 -> 0.17818, summer super-off 0.08147 -> 0.08385,
# winter 0.19990 -> 0.20574 / 0.14337 -> 0.14757 / 0.07410 -> 0.07627. EV-TOU-5's summer
# on-peak EECC is 1.35x TOU-DR1's, the price of its collapsed super-off-peak delivery rate.
schedule_id: EV-TOU-5
name: SDG&E bundled generation (Schedule EECC) matched to EV-TOU-5
provider: SDG&E
layer: generation
effective_date: 2026-08-01
citation: >-
  SDG&E "Schedule EV-TOU-5 - DOMESTIC TIME-OF-USE FOR HOUSEHOLDS WITH ELECTRIC VEHICLES
  ... Effective 8/1/2026" Total Rates Table, Schedule EECC Rate column
  (sdge.com/sites/default/files/regulatory/8-1-26 Schedule EV-TOU-5 Total Rates Table.pdf),
  and the matching "8-1-26 Schedule EV-TOU-5-CARE Total Rates Table.pdf" for the CARE
  derivation, both retrieved 2026-09-09. Commodity component defined by Schedule EECC;
  seasons per Schedule EECC. Period definitions per the matching delivery spec.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
    - {period: super_off_peak, hours: [[0, 6], [10, 14]], days: weekday}
    - {period: super_off_peak, hours: [[0, 14]], days: weekend}
  default_period: off_peak
  holiday_calendar: sdge_residential
  labels: {on_peak: On-Peak, off_peak: Off-Peak, super_off_peak: Super Off-Peak}

energy:
  summer_on_peak:        {standard: 0.48396, care: 0.3145740}
  summer_off_peak:       {standard: 0.17818, care: 0.1158170}
  summer_super_off_peak: {standard: 0.08385, care: 0.0545025}
  winter_on_peak:        {standard: 0.20574, care: 0.1337310}
  winter_off_peak:       {standard: 0.14757, care: 0.0959205}
  winter_super_off_peak: {standard: 0.07627, care: 0.0495755}
