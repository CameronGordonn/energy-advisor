# SDG&E Schedule TOU-DR2 — DELIVERY layer (UDC + non-bypassable charges).
# The TWO-period residential TOU option: On-Peak 4-9 p.m., Off-Peak everything else,
# year-round, with no weekend/holiday distinction and no super-off-peak. See the TOU-DR1
# spec for the layer model, the NBC set, and the minimum-bill / NBC-floor resolution —
# all identical here.
#
# Unlike TOU-DR1, TOU-DR2's UDC total IS time-differentiated, but only in summer
# (0.33396 on-peak vs 0.32750 off-peak); winter is flat at 0.32948.
schedule_id: TOU-DR2
name: Residential Time-of-Use (two-period) - Delivery
provider: SDG&E
layer: delivery
effective_date: 2026-06-01
citation: >-
  SDG&E "Schedule TOU-DR2 - Residential Time of Use Service Effective 6/1/2026" Total
  Rates Table and the matching TOU-DR2-CARE table (sdge.com/sites/default/files/
  regulatory/), retrieved 2026-07-23. Time periods from Schedule TOU-DR2 tariff sheet
  (elec_elec-scheds_tou-dr2.pdf), "Time Periods - Year Round". Seasons from Schedule
  EECC; Minimum Bill structure per Schedule TOU-DR1 Sheet 29955-E.

seasons:
  summer_months: [6, 7, 8, 9, 10]      # Schedule EECC: Summer Jun 1 - Oct 31
  winter_months: [11, 12, 1, 2, 3, 4, 5]

# Schedule TOU-DR2, "Time Periods / Year Round":
#   On-Peak  4:00 p.m. - 9:00 p.m.   (summer and winter alike)
#   Off-Peak 9:00 p.m. - 4:00 p.m.   (i.e. all other hours)
# The sheet gives ONE table with no weekday/weekend split, so no holiday calendar is
# named — on this schedule a holiday is priced exactly like any other day.
tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
  default_period: off_peak
  labels: {on_peak: On-Peak, off_peak: Off-Peak}

fixed_name: Base Services Charge
fixed_per_day:
  standard: 0.79343
  care: 0.19713

# standard = UDC Total + WF-NBC/DWR-BC 0.00591
# care     = 0.65 x (UDC Total - CARE surcharge exemption 0.00864), no WF-NBC/DWR-BC
#   summer on-peak  UDC 0.33396 -> std 0.33987, care 0.65 x 0.32532 = 0.21146
#   summer off-peak UDC 0.32750 -> std 0.33341, care 0.65 x 0.31886 = 0.20726
#   winter both     UDC 0.32948 -> std 0.33539, care 0.65 x 0.32084 = 0.20855
# (Derivation and its exact validation against the printed CARE totals: see the TOU-DR1
# spec. Same statewide 35% CARE discount, printed on the CARE rate table itself.)
energy:
  summer_on_peak:  {standard: 0.33987, care: 0.21146}
  summer_off_peak: {standard: 0.33341, care: 0.20726}
  winter_on_peak:  {standard: 0.33539, care: 0.20855}
  winter_off_peak: {standard: 0.33539, care: 0.20855}

# "Up to 130% of Baseline Adjustment Credit", identical to TOU-DR1.
baseline:
  # SDG&E publishes baseline allowances per CLIMATE ZONE and per Basic vs All-Electric —
  # a CUSTOMER fact, not a schedule fact, so the whole tariff table ships here and the
  # zone is supplied at bill time (`compute_bill(..., territory="coastal_all_electric")`).
  # Omitting it raises; there is deliberately no default, because a wrong zone silently
  # mis-sizes the largest credit on the bill. Zones are shown on Territory Served Map No.1.
  #
  # Cal. P.U.C. Sheet 29294-E (Schedule DR, Sheet 5, Special Condition 3), kWh per day:
  #                       Coastal  Inland  Mountain  Desert
  #   Basic       Summer      9.0    10.4      13.6    15.9
  #               Winter      9.2     9.6      12.9    10.9
  #   All-Electric Summer     8.3    10.1      16.5    18.5
  #               Winter     13.5    15.8      26.0    20.0
  # "All Electric allowances are available upon application to those customers who have
  # permanently installed space heating or who have electric water heating and receive no
  # energy from another source."
  allowances:
    coastal_basic:         {summer:  9.0, winter:  9.2}
    inland_basic:          {summer: 10.4, winter:  9.6}
    mountain_basic:        {summer: 13.6, winter: 12.9}
    desert_basic:          {summer: 15.9, winter: 10.9}
    coastal_all_electric:  {summer:  8.3, winter: 13.5}
    inland_all_electric:   {summer: 10.1, winter: 15.8}
    mountain_all_electric: {summer: 16.5, winter: 26.0}
    desert_all_electric:   {summer: 18.5, winter: 20.0}
  allowance_multiplier: 1.30
  credit_per_kwh: {standard: -0.10663, care: -0.06931}

minimum_bill:
  per_day: {standard: 0.329, care: 0.164}
  citation: >-
    SDG&E Minimum Bill $0.329/day, 50% discount for CARE/FERA -> $0.164/day, per Schedule
    TOU-DR1 Cal. P.U.C. Sheet 29955-E (Advice 3167-E); the current Total Rates Table does
    not restate it. Confirm currency before relying on the floor binding.
