# SDG&E Schedule TOU-DR1 — DELIVERY layer, 2026-05-01 vintage.
# RATES ARE THE 4/1/2026 SHEET'S; ONLY THE TOU WINDOW CHANGED ON THIS DATE.
#
# ---------------------------------------------------------------------------------------
# WHY THIS FILE EXISTS — a modeling decision with real dollar impact, recorded rather than
# taken silently.
#
# Two independent things change TOU-DR1 pricing in 2026, on different dates:
#   * RATES changed 1/1, then 4/1, then 6/1 (three published Total Rates Tables).
#   * The weekday 10:00-14:00 SUPER-OFF-PEAK WINDOW went from March-and-April-only to
#     YEAR-ROUND effective 2026-05-01.
# SDG&E published no 5/1/2026 Total Rates Table — verified, the 5-1-26 URL in this series
# returns HTTP 404 — so the 4/1 rates stayed in force through May, and the window change
# lands in the MIDDLE of the 4/1 rate vintage.
#
# The options were:
#   (a) THIS: split the 4/1 rate vintage into two spec versions, 4/1 (Mar/Apr window) and
#       5/1 (year-round window), duplicating the rates. Each spec then states truthfully
#       what the tariff was on its own effective date.
#   (b) Put the year-round window on the 4/1 spec. Numerically this happens to be correct
#       for every day that spec would govern (in April the two rules agree; in May the
#       year-round rule is the right one) — but the file would assert a period definition
#       that was NOT in force on 4/1. Any later-inserted vintage, or any reuse of the spec
#       over a different span, would then be silently wrong.
#   (c) Put the March/April window on the 4/1 spec and let it govern May too. This is
#       simply wrong: it prices weekday 10:00-14:00 in May 2026 as OFF-PEAK.
# Dollar impact of getting it wrong (c): four hours a day across ~21 May weekdays at the
# off-peak/super-off-peak EECC spread of 0.12853 - 0.04121 = 0.08732/kWh — on the order of
# $7/month for a household drawing 1 kW in that window, and materially more for anything
# that deliberately shifts load or charges a battery there.
#
# (a) was chosen: specs are transcriptions of a dated tariff state, and (b) would make this
# repo's central claim — that every number is what the sheet said on that date — false in
# a file that still carried a citation. The cost is one duplicated rate block, which is
# explicit here rather than hidden.
#
# SOURCING CAVEAT, unchanged and honest: the 2026-05-01 window change is sourced to SDG&E's
# own customer-facing publications ("New Daytime Super Off-Peak Hours...",
# sdgetoday.com/NewSuperPeakHours; sdge.com/super-off-peak-residential), corroborated by
# contemporaneous local coverage. The superseding advice letter and revised Cal. P.U.C.
# sheet were NOT located. That caveat is the reason the window's effective date is pinned
# by test rather than assumed.
# ---------------------------------------------------------------------------------------
schedule_id: TOU-DR1
name: Residential Time-of-Use (SDG&E default) - Delivery
provider: SDG&E
layer: delivery
effective_date: 2026-05-01
citation: >-
  RATES: SDG&E "Schedule TOU-DR1 - Residential Time of Use Service Effective 4/1/2026"
  Total Rates Table and the matching TOU-DR1-CARE table (retrieved 2026-09-07), which
  remained in force through May 2026 — SDG&E published no 5/1/2026 table (the 5-1-26 URL
  in that series returns HTTP 404) and the next one is effective 6/1/2026. PERIOD
  DEFINITIONS: the weekday 10:00-14:00 super-off-peak window became year-round effective
  2026-05-01 per SDG&E "New Daytime Super Off-Peak Hours Give Customers More Ways to Lower
  Electric Bills" (sdgetoday.com/NewSuperPeakHours) and sdge.com/super-off-peak-residential
  (both retrieved 2026-09-07); the superseding advice letter and revised Cal. P.U.C. sheet
  were not located. Structure, Minimum Bill and Franchise Fee Differential from Cal. P.U.C.
  Sheets 29952-29955-E; seasons from Schedule EECC; holidays from SDG&E Electric Rule 1;
  baseline allowances from Schedule DR, Cal. P.U.C. Sheet 29294-E.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

# YEAR-ROUND weekday 10:00-14:00 super-off-peak — the one difference from the 4/1 vintage.
tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
    - {period: super_off_peak, hours: [[0, 6], [10, 14]], days: weekday}
    - {period: super_off_peak, hours: [[0, 14]], days: weekend}
  default_period: off_peak
  holiday_calendar: sdge_residential
  labels: {on_peak: On-Peak, off_peak: Off-Peak, super_off_peak: Super Off-Peak}

fixed_name: Base Services Charge
fixed_per_day:
  standard: 0.79343
  care: 0.19713

# 4/1/2026 rates: UDC Total 0.34061 + WF-NBC/DWR-BC 0.00591 = 0.34652;
# care = 0.65 x (0.34061 - 0.00864) = 0.21578.
energy:
  summer_on_peak:        {standard: 0.34652, care: 0.21578}
  summer_off_peak:       {standard: 0.34652, care: 0.21578}
  summer_super_off_peak: {standard: 0.34652, care: 0.21578}
  winter_on_peak:        {standard: 0.34652, care: 0.21578}
  winter_off_peak:       {standard: 0.34652, care: 0.21578}
  winter_super_off_peak: {standard: 0.34652, care: 0.21578}

baseline:
  allowances:
    coastal_basic:         {summer:  9.0, winter:  9.2}
    inland_basic:          {summer: 10.4, winter:  9.6}
    mountain_basic:        {summer: 13.6, winter: 12.9}
    desert_basic:          {summer: 15.9, winter: 10.9}
    coastal_all_electric:  {summer:  8.3, winter: 13.5}
    inland_all_electric:   {summer: 10.1, winter: 15.8}
    mountain_all_electric: {summer: 16.5, winter: 26.0}
    desert_all_electric:   {summer: 18.5, winter: 20.0}
  allowance_multiplier: 1.30
  credit_per_kwh: {standard: -0.10892, care: -0.07080}

minimum_bill:
  per_day: {standard: 0.329, care: 0.164}
  citation: >-
    SDG&E Schedule TOU-DR1, Minimum Bill, Cal. P.U.C. Sheet 29955-E (Advice 3167-E).
    NOTE the sheet's rate values are from the 2018 filing and the Total Rates Tables do
    not restate the minimum bill; confirm the $0.329/$0.164 figures are still current
    before shipping a dollar figure that depends on the floor binding.

# --- CCA / DIRECT ACCESS ONLY ------------------------------------------------------------
# Note 2 of the Total Rates Table: "Unbundled customers are those who take generation from
# other providers, such as Direct Access (DA) or Community Choice Aggregation (CCA).
# Unbundled customers do not pay SDG&E's commodity rates. The Total Energy Charge for an
# unbundled customer includes UDC, WF-NBC, DWR-BC and Power Charge Indifference Adjustment
# (PCIA) rates."
#
# The `energy` rates above are exactly UDC Total + WF-NBC/DWR-BC, so an unbundled customer's
# bill is THIS layer + the PCIA below + their CCA's own generation spec, which replaces the
# bundled EECC layer entirely. `applies_to: cca` keeps one delivery spec serving both
# bundled and unbundled customers instead of two copies that would drift apart at the next
# rate change — the same pattern the PG&E specs use.
#
# THE PCIA IS VINTAGED by the year the customer's load left bundled service, and on this
# sheet the spread is 0.01538 .. 0.05055 $/kWh — a range of 0.03517/kWh, which on a
# 6,000 kWh/yr household is about $211 a year, more than the whole annual saving
# the PG&E case study found from switching supplier. Pinning one vintage here would be the
# largest single error a CCA bill could carry. The whole table ships instead and the vintage is
# supplied at bill time — `compute_bill(..., vintage="2018")` — and omitting it RAISES
# rather than defaulting, exactly as an unknown baseline climate zone does.
#   NOTE this vintage has no rate table of its own (SDG&E published no 5/1/2026
#   sheet); it carries the 4/1/2026 PCIA table, which stayed in force through May.
#
# The 2001 Legacy vintage is DA-only on this sheet (a $(0.00006) credit, printed in the DA
# column with no CCA value), so it is deliberately absent: a CCA customer cannot be on it.
#
# CARE: the TOU-DR1-CARE table prints this same PCIA table with no CARE adjustment, so the
# PCIA is modeled as class-independent. (`PerKwhAdder` has no CARE variant in any case —
# the schema gap recorded in HANDOFF; it is not binding here because the sheet shows none.)
adders:
  - name: Power Charge Indifference Adjustment (vintaged)
    applies_to: cca
    per_kwh_by_vintage:
      "2009": 0.01538
      "2010": 0.02010
      "2011": 0.03031
      "2012": 0.03637
      "2013": 0.03572
      "2014": 0.03572
      "2015": 0.03687
      "2016": 0.03595
      "2017": 0.03576
      "2018": 0.03670
      "2019": 0.03450
      "2020": 0.03605
      "2021": 0.03564
      "2022": 0.03005
      "2023": 0.02828
      "2024": 0.05055
      "2025": 0.04987
      "2026": 0.04987
    citation: >-
      SDG&E "Schedule TOU-DR1 - Residential Time of Use Service Effective 4/1/2026" Total
      Rates Table, RESIDENTIAL PCIA RATE table, CCA column (retrieved 2026-09-07/08).
      Applicability per note 2 of the same sheet. Vintage is the year the customer's load
      departed bundled service; see Schedules DA-CRS / CCA-CRS.

non_bypassable:
  included_in_energy_rate: true
  components:
    Public Purpose Programs:       {standard:  0.01515, care: 0.00985}
    Nuclear Decommissioning:       {standard:  0.00000, care: 0.00000}
    Competition Transition Charge: {standard: -0.00007, care: -0.00005}
    Wildfire Fund / DWR Bond:      {standard:  0.00591, care: 0.00000}
  citation: >-
    SDG&E Schedule TOU-DR1 Total Rates Table components (PPP, ND, CTC, WF-NBC/DWR-BC),
    4/1/2026 sheet (in force through May 2026), retrieved 2026-09-07; classed
    non-bypassable per PG&E Schedule NBT Cal. P.U.C. Sheet 57359-E SC 2.f. CARE WF-NBC
    exemption: Sheet 29953-E note 3 and the CARE table's note 1.

# --- FRANCHISE FEES (session 31) -------------------------------------------------------
# Two city-dependent lines SDG&E prints under "Taxes & Fees on Electric Charges". Both
# depend on the household's CITY, a customer fact supplied at bill time as `jurisdiction`
# (city_of_san_diego | other) that raises when omitted — the `territory` pattern.
# Neither is in the Total Rates Tables, so neither moves the published-impact (tier 2)
# figures, which are city-neutral; pass jurisdiction="other" to reproduce those.
#
# Measured against SDCP's published specimen statement (2/12-3/13/26, TOU-DR1, Coastal,
# SDCP 2021V, 251 kWh; notes/sdcp_specimen_bill_2026-10.md):
#   Franchise Fee Differential     printed 82.01 x 5.78% = 4.74   ours 4.74 (base exact)
#   Franchise Fee Equivalent Surch printed 49.71 x 6.88% = 3.42   ours 48.76 x 6.88% = 3.35
# The second base is NOT reproduced: Schedule CCA says "imputed Schedule EECC", and the
# imputed EECC on that statement is 48.76 (printed as its own "Electricity Generation"
# line), yet the surcharge prints a 49.71 base. The 0.95 (~1.95%) gap is unexplained and
# deliberately not fitted to one specimen whose own SDCP lines do not add up either.
# Worth -$0.07 there. Settle it against a real CCA statement.
surcharges:
  - name: City of San Diego Franchise Fee Differential
    rate_by_jurisdiction: {city_of_san_diego: 0.0578, other: 0.0}
    of: pretax
    # Base on the specimen = every delivery charge EXCEPT the PCIA and the Wildfire Fund
    # charge (92.42 - 8.93 - 1.48 = 82.01, exact). Both are excluded because neither is
    # SDG&E revenue: the WF-NBC/DWR-BC is the state's, the PCIA recovers above-market
    # procurement. WF-NBC is folded into our energy rate, so it is removed as kWh x rate.
    exclude:
      - Power Charge Indifference Adjustment (vintaged)
      - Wildfire Fund / DWR Bond
    # bundled: the sheet applies 5.78% to "the monthly billings calculated under this
    #   Schedule", and whether a bundled bill's EECC generation is in that base is not
    #   settled — the CCA specimen cannot say, because its EECC line and the matching
    #   credit net to zero inside the base either way.
    # care: whether the base is before or after the CARE discount is not settled.
    unverified_for: [bundled, care]
    citation: >-
      SDG&E Schedule TOU-DR1, "Franchise Fee Differential", Cal. P.U.C. Sheet 29955-E
      ("A Franchise Fee Differential of 5.78% will be applied to the monthly billings
      calculated under this Schedule for all customers within the corporate limits of the
      City of San Diego"), and the same 5.78% in Schedule CCA Sheet 3, Cal. P.U.C. Sheet
      23574-E, for CCA customers. Both retrieved 2026-10-01. Base (excluding PCIA and
      WF-NBC) derived exactly from SDCP's published 2026 specimen statement.
  - name: Franchise Fee Equivalent Surcharge
    applies_to: cca
    rate_by_jurisdiction: {city_of_san_diego: 0.0688, other: 0.011}
    of: imputed_generation
    imputed_provider: SDG&E
    # care: whether SDG&E imputes EECC at the CARE or the standard rate is not settled
    # (see open decision 9 — how CARE composes with a CCA is already contested).
    unverified_for: [care]
    citation: >-
      SDG&E Schedule CCA, "Electric Franchise Fee Equivalent Surcharge", Cal. P.U.C.
      Sheets 23574-E and 19741-E: "Pursuant to Decision 97-10-087, the Utility will
      collect franchise fees on the commodity portion (i.e., EECC charges) of CCA energy
      charges. The Utility will impute its own Schedule EECC to customers taking service
      under this schedule and compute a franchise fee equivalent surcharge based on
      imputed Schedule EECC." Rates 6.88% within the City of San Diego and 1.1% elsewhere
      from SDG&E, "Calculating the Franchise Fees on Electric Energy Supplied by Others"
      (sdge.com, retrieved 2026-10-01). Unresolved -$0.07 base gap on SDCP's specimen:
      see the comment above.
