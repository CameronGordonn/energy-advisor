# SDG&E Schedule EECC matched to TOU-DR2 — GENERATION layer, 4/1/2026 vintage.
#
# Composition and CARE derivation: see the 2026-01-01 spec's header.
#
# ⭐ THE EECC VALUES BELOW ARE IDENTICAL TO THE 6/1/2026 SHEET'S — the same pattern
# TOU-DR1 shows. Generation moved on 4/1 and then held; DELIVERY moved again on 6/1
# (TOU-DR2 winter UDC Total 0.34061 -> 0.32948) while this layer did not. The engine
# versions the two layers independently, so this is expressible rather than a conflict,
# but a tool that models "the rate changed on 6/1" as a single event misprices one layer
# or the other for every bill spanning that date.
schedule_id: TOU-DR2
name: SDG&E bundled generation (Schedule EECC) matched to TOU-DR2
provider: SDG&E
layer: generation
effective_date: 2026-04-01
citation: >-
  SDG&E "Schedule TOU-DR2 - Residential Time of Use Service Effective 4/1/2026" Total
  Rates Table, Schedule EECC Rate column (sdge.com/sites/default/files/regulatory/4-1-26
  Schedule TOU-DR2 Total Rates Table.pdf), and the matching "4-1-26 Schedule TOU-DR2-CARE
  Total Rates Table.pdf" for the CARE derivation, both retrieved 2026-09-08. Commodity
  component defined by Schedule EECC; seasons per Schedule EECC. Period definitions per
  the matching delivery spec.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
  default_period: off_peak
  labels: {on_peak: On-Peak, off_peak: Off-Peak}

energy:
  summer_on_peak:  {standard: 0.34920, care: 0.2269800}
  summer_off_peak: {standard: 0.08432, care: 0.0548080}
  winter_on_peak:  {standard: 0.27475, care: 0.1785875}
  winter_off_peak: {standard: 0.13777, care: 0.0895505}
