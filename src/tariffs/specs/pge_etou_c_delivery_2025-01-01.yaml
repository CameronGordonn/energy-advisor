# PG&E E-TOU-C — DELIVERY layer, EARLY-2025 summer cycle (through 2025-08-31), PRE-IGFC.
# Rates observed on customer bill statements 2025-08-27 and the 08/26–08/31 block of
# 2025-09-26 (older RIN USCA-PGXX-0100-0000).
#
# Superseded 2025-09-01 (see pge_etou_c_delivery_2025-09-01.yaml): energy and baseline
# credit both stepped that date. Winter rates for this cycle are unknown (no readable
# pre-Sep-2025 winter bill) — left null so billing a winter-2025 date REFUSES rather than
# guesses. effective_date is an observed lower bound.
schedule_id: E-TOU-C
name: Time-of-Use (Peak Pricing 4-9 p.m. Every Day) - Delivery [early-2025 summer]
provider: PG&E
layer: delivery
effective_date: 2025-01-01
citation: >-
  PG&E E-TOU-C delivery, observed on customer bill statement 2025-08-27 and the
  08/26/2025-08/31/2025 block of 2025-09-26 (RIN USCA-PGXX-0100-0000). Pre-IGFC.
  effective_date is an observed lower bound; cross-ref PG&E tariff sheet
  ELEC_SCHEDS_E-TOU-C.pdf.

seasons:
  summer_months: [6, 7, 8, 9]
  winter_months: [1, 2, 3, 4, 5, 10, 11, 12]

tou:
  peak_hours: [16, 17, 18, 19, 20]

fixed_per_day: null

# Winter left null: no readable pre-Sep-2025 winter bill.
energy:
  summer_peak:    {standard: 0.62569, care: 0.39142}
  summer_offpeak: {standard: 0.50269, care: 0.31147}
  winter_peak:    {}
  winter_offpeak: {}

baseline:
  territory: T
  allowance_kwh_per_day_summer: 7.1
  allowance_kwh_per_day_winter: 12.9
  credit_per_kwh: {standard: -0.10301, care: -0.06695}

adders:
  - name: Power Charge Indifference Adjustment (2018 vintage)
    applies_to: cca
    per_kwh: 0.00670
    citation: >-
      PG&E PCIA 2018 vintage (pre-2026), derived flat from bill 2025-08-27
      (1.62/241.474 = 0.00671). Cross-ref PCIA schedule.
  - name: Generation Credit (PG&E generation not supplied)
    per_kwh_summer_peak:    -0.23395
    per_kwh_summer_offpeak: -0.13206
    citation: >-
      PG&E generation credit for CCA customers, summer TOU peak/off least-squares fit
      across the 2025 summer sub-blocks (<=$0.003); winter null (no readable pre-Sep-2025
      winter bill). Cross-ref PG&E generation tariff.

surcharges:
  - name: Franchise Fee Surcharge
    applies_to: cca
    rate: 0.00230
    of: energy
    citation: >-
      PG&E Franchise Fee Surcharge, pre-2026. APPROXIMATE (~0.23% of energy) — derived
      from bills; exact basis unconfirmed, residual <$0.05.
  - name: City of Santa Cruz Utility Users' Tax
    rate: 0.085
    of: pretax
    citation: >-
      City of Santa Cruz UUT 8.5% on delivery subtotal (pre-FF); gross matches bill to
      the cent. A separate observed 'UUT Adjustment' offsets most of it (see
      SESSION_NOTES); applied by the reconciliation harness, not this spec.
