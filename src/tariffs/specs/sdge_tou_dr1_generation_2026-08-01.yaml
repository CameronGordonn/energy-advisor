# SDG&E Schedule EECC matched to TOU-DR1 — GENERATION layer, 8/1/2026 vintage.
#
# ⭐ THIS IS THE FILING WHERE GENERATION AND DELIVERY MOVED IN OPPOSITE DIRECTIONS.
# The 6/1 filing moved delivery only and left EECC alone; the 8/1 filing moves both, and
# not the same way: UDC Total fell 0.32948 -> 0.32601 while summer on-peak EECC rose
# 0.34920 -> 0.35943. Summer off-peak (+0.00376) and every winter period also rose. So the
# headline "SDG&E delivery rates went down in August" is true and, for a summer on-peak
# kWh, entirely misleading — the all-in Total Electric Rate went UP 0.00676/kWh.
#
# Composition, and why the CARE split is derived rather than conventional: see the
# 2026-06-01 spec's header. The identity still holds exactly here — delivery keeps the
# 0.00864 CARE-surcharge exemption, each layer takes the 35%, and the two re-sum to SDG&E's
# printed Total Adjusted CARE Rate on all six cells (max residual 5e-7, from the sheet's own
# 5-dp rounding). `tests/tariffs/test_sdge_vintages.py` pins both totals.
schedule_id: TOU-DR1
name: SDG&E bundled generation (Schedule EECC) matched to TOU-DR1
provider: SDG&E
layer: generation
effective_date: 2026-08-01
citation: >-
  SDG&E "Schedule TOU-DR1 - Residential Time of Use Service Effective 8/1/2026" Total Rates
  Table, Schedule EECC Rate column (sdge.com/sites/default/files/regulatory/8-1-26 Schedule
  TOU-DR1 Total Rates Table.pdf), and the matching "8-1-26 Schedule TOU-DR1-CARE Total Rates
  Table.pdf" for the CARE derivation, both retrieved 2026-09-09. Commodity component defined
  by Schedule EECC; seasons per Schedule EECC "Summer: June 1 - October 31, Winter:
  November 1 - May 31". Period definitions per the matching delivery spec.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

# Identical to the delivery layer's periods, and to the 6/1 vintage's — the super-off-peak
# window is still year-round (sdge.com/super-off-peak-residential, retrieved 2026-09-09).
tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
    - {period: super_off_peak, hours: [[0, 6], [10, 14]], days: weekday}
    - {period: super_off_peak, hours: [[0, 14]], days: weekend}
  default_period: off_peak
  holiday_calendar: sdge_residential
  labels: {on_peak: On-Peak, off_peak: Off-Peak, super_off_peak: Super Off-Peak}

# EECC $/kWh. `standard` read straight off the 8/1/2026 table; `care` = 0.65 x standard,
# kept at full precision so the layer sum reproduces the printed CARE total.
#
# The TOU spread WIDENED. Summer on-peak is now 8.5x super-off-peak (0.35943 vs 0.04241),
# an on/super-off spread of 0.31702/kWh against 0.30799 on the 6/1 sheet; the winter spread
# is 0.17752 against 0.17247. Since TOU-DR1's delivery layer is period-flat, these six
# numbers ARE the schedule's entire price signal, so every load-shift, battery-arbitrage and
# export-timing conclusion for Aug-Dec 2026 moves with them — slightly in favour of shifting.
energy:
  summer_on_peak:        {standard: 0.35943, care: 0.2336295}
  summer_off_peak:       {standard: 0.13229, care: 0.0859885}
  summer_super_off_peak: {standard: 0.04241, care: 0.0275665}
  winter_on_peak:        {standard: 0.28279, care: 0.1838135}
  winter_off_peak:       {standard: 0.19868, care: 0.1291420}
  winter_super_off_peak: {standard: 0.10527, care: 0.0684255}
