# SDG&E Schedule EECC matched to EV-TOU-5 — GENERATION layer (bundled commodity),
# 1/1/2026 vintage.
#
# Composition and the CARE derivation follow the TOU-DR1 generation specs exactly:
# generation carries no CARE exemption of its own, so generation_care = 0.65 x EECC,
# while delivery keeps the 0.00864 CARE-surcharge exemption. That split is the only one
# that rebuilds SDG&E's printed Total Adjusted CARE Rate, on every cell of every vintage.
#
# SUPER-OFF-PEAK WINDOW is March/April only on this vintage (pre-2026-05-01); the rules
# below are byte-identical to the matching delivery spec's, asserted by test.
#
# ⭐ THIS IS THE WIDEST TOU SPREAD IN THE RESIDENTIAL BOOK. Summer EECC runs 0.47075
# on-peak against 0.08157 super-off-peak — a 5.8x ratio, where TOU-DR1's summer EECC
# spread is 8.5x but on a much smaller delivery base. Combined with a delivery rate that
# itself collapses in super-off-peak, EV-TOU-5 is the schedule where load-shifting and
# battery dispatch conclusions are most sensitive to getting the window right.
schedule_id: EV-TOU-5
name: SDG&E bundled generation (Schedule EECC) matched to EV-TOU-5
provider: SDG&E
layer: generation
effective_date: 2026-01-01
citation: >-
  SDG&E "Schedule EV-TOU-5 - DOMESTIC TIME-OF-USE FOR HOUSEHOLDS WITH ELECTRIC VEHICLES
  ... Effective 1/1/2026" Total Rates Table, Schedule EECC Rate column
  (sdge.com/sites/default/files/regulatory/1-1-26 Schedule EV-TOU-5 Total Rates
  Table.pdf), and the matching "1-1-26 Schedule EV-TOU-5-CARE Total Rates Table.pdf" for
  the CARE derivation, both retrieved 2026-09-08. Commodity component defined by Schedule
  EECC; seasons per Schedule EECC. Period definitions per the matching delivery spec.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
    - {period: super_off_peak, hours: [[0, 6]], days: weekday}
    - {period: super_off_peak, hours: [[10, 14]], days: weekday, months: [3, 4]}
    - {period: super_off_peak, hours: [[0, 14]], days: weekend}
  default_period: off_peak
  holiday_calendar: sdge_residential
  labels: {on_peak: On-Peak, off_peak: Off-Peak, super_off_peak: Super Off-Peak}

energy:
  summer_on_peak:        {standard: 0.47075, care: 0.3059875}
  summer_off_peak:       {standard: 0.17332, care: 0.1126580}
  summer_super_off_peak: {standard: 0.08157, care: 0.0530205}
  winter_on_peak:        {standard: 0.20013, care: 0.1300845}
  winter_off_peak:       {standard: 0.14354, care: 0.0933010}
  winter_super_off_peak: {standard: 0.07419, care: 0.0482235}
