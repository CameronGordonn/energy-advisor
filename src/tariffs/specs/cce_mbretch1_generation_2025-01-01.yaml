# Central Coast Community Energy (3CE) — GENERATION layer, PRE-2026-02-15 rates.
# Observed on customer bill statements 2025-11-26, 2025-12-28, 2026-01-29 and the
# old-rate sub-block of 2026-03-01 (schedule MBRETCH1 "3Cchoice", RIN USCA-XXMB-0338-PGE).
# Superseded 2026-02-15 (see cce_mbretch1_generation_2026-02-15.yaml).
#
# effective_date is an OBSERVED LOWER BOUND (confirmed on winter-2025 bills). Summer left
# null: no summer-2025 3CE bill is machine-readable (Aug–Sep 2025 statements are images),
# so billing a summer-2025 date refuses rather than guesses.
schedule_id: MBRETCH1
name: 3Cchoice Time-of-Use (Peak Pricing 4-9 p.m. Every Day) - Generation [pre-2026-02-15]
provider: Central Coast Community Energy (3CE)
layer: generation
effective_date: 2025-01-01
citation: >-
  3CE MBRETCH1 generation, observed on customer bill statements 2025-11-26, 2025-12-28,
  2026-01-29, and the 01/28/2026-02/14/2026 sub-block of statement 2026-03-01
  (RIN USCA-XXMB-0338-PGE). effective_date is an observed lower bound; cross-ref
  3cenergy.org for the published rate history.

seasons:
  summer_months: [6, 7, 8, 9]
  winter_months: [1, 2, 3, 4, 5, 10, 11, 12]

tou:
  peak_hours: [16, 17, 18, 19, 20]

energy:
  summer_peak:    {}
  summer_offpeak: {}
  winter_peak:    {standard: 0.15386}
  winter_offpeak: {standard: 0.12883}

# California Energy Commission surcharge, $/kWh (fixed statewide).
energy_commission_tax_per_kwh: 0.0003

surcharges:
  - name: City of Santa Cruz Utility Users' Tax
    rate: 0.085
    of: pretax
    citation: >-
      City of Santa Cruz UUT 8.5% on generation subtotal; gross matches bill to the cent.
      A separate observed 'UUT Adjustment' offsets most of it (applied by the harness).
