# SDG&E Schedule EECC matched to TOU-DR2 — GENERATION layer (bundled commodity),
# 1/1/2026 vintage.
#
# Composition and the CARE derivation follow the TOU-DR1 generation specs exactly:
# generation carries no CARE exemption of its own, so generation_care = 0.65 x EECC,
# and delivery keeps the 0.00864 CARE-surcharge exemption. That split is not a
# convention chosen here — it is the only one that rebuilds SDG&E's printed Total
# Adjusted CARE Rate, on every cell of every vintage.
#
# ⭐ THIS LAYER IS WHERE TOU-DR2's TOU SIGNAL MOSTLY LIVES, but — unlike TOU-DR1 — not
# all of it: TOU-DR2's UDC total is itself period-differentiated in summer (0.34550
# on-peak vs 0.33903 off-peak on this vintage). So a TOU-DR2 load-shift analysis must
# vary BOTH layers, where a TOU-DR1 one can vary generation alone.
schedule_id: TOU-DR2
name: SDG&E bundled generation (Schedule EECC) matched to TOU-DR2
provider: SDG&E
layer: generation
effective_date: 2026-01-01
citation: >-
  SDG&E "Schedule TOU-DR2 - Residential Time of Use Service Effective 1/1/2026" Total
  Rates Table, Schedule EECC Rate column (sdge.com/sites/default/files/regulatory/1-1-26
  Schedule TOU-DR2 Total Rates Table.pdf), and the matching "1-1-26 Schedule TOU-DR2-CARE
  Total Rates Table.pdf" for the CARE derivation, both retrieved 2026-09-08. Commodity
  component defined by Schedule EECC; seasons per Schedule EECC. Period definitions per
  the matching delivery spec.

seasons:
  summer_months: [6, 7, 8, 9, 10]
  winter_months: [11, 12, 1, 2, 3, 4, 5]

tou:
  rules:
    - {period: on_peak, hours: [[16, 21]]}
  default_period: off_peak
  labels: {on_peak: On-Peak, off_peak: Off-Peak}

energy:
  summer_on_peak:  {standard: 0.34962, care: 0.2272530}
  summer_off_peak: {standard: 0.08442, care: 0.0548730}
  winter_on_peak:  {standard: 0.27508, care: 0.1788020}
  winter_off_peak: {standard: 0.13793, care: 0.0896545}
