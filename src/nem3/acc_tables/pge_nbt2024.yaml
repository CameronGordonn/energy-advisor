  files dated 2024-12-18), retrieved 2026-09-09. Published under CPUC Resolution E-5301,
  which requires 20 years posted; only the 9 years from PTO are effective rates, the
  rest illustrative (see ''Solar Billing Plan Export Rates Readme.txt'' in the zip).
  Methodology: PG&E Schedule NBT Cal. P.U.C. Sheet 57352-E. Delivery = RateLookupID
  USCA-PGXX, generation = USCA-XXPG; generation applies only to customers taking bundled
  generation from PG&E (CCA/DA customers must look to their own provider). Calendar-2026
  cells cross-checked against PG&E''s printed ''PGE_Solar Billing Plan_EEC Values
  Price Sheet 2024.pdf'' from pge.com/energyexportcredit: 571 of 576 cells agree to
  1e-5, the rest being DST-transition weekend cells (see tests/nem3/test_acc_pge.py).
  NOTE: the zip readme mislabels both NBT23 and NBT24 as ''applications filed in 2025'';
  the RateName column in this file reads NBT2024 and the printed price sheet is titled
  ''2024 Interconnection Application Year'', so the label here follows those.'
