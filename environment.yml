name: energy-advisor
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas
  - numpy
  - scipy
  - matplotlib
  - pydantic
  - pyyaml
  - requests
  - pytest
  - pytest-cov
  - jupyterlab
  - ruff
  - tesseract        # OCR for the image-only (scanned) bill PDFs (dev tool)
  - poppler          # pdftoppm: rasterize PDF pages for OCR
  - pytesseract      # tesseract Python wrapper
  - pdf2image        # PDF -> PIL images for OCR
  - pip
  - pip:
      - cvxpy          # battery dispatch optimization (LP/QP)
      - typer          # CLI
      - rich           # CLI output
      - pypdf          # bill-PDF extraction for golden fixtures (dev tool)
