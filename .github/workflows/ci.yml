# The merge gate, run in public.
#
# CLAUDE.md makes golden-bill reconciliation the gate for anything touching tariffs/ or
# nem3/. This workflow runs the same suite a contributor runs locally, in the documented
# conda environment, on every push and pull request.
#
# HONEST SCOPE NOTE, stated here because the badge should not overclaim: the golden-bill
# reconciliation tests SKIP in CI. They need the household's real Green Button interval
# export, which is gitignored and never committed (privacy invariant). CI therefore proves
# the engine, schema, loader, tariff-spec identities and NEM logic are green — it does not
# re-prove the ±$2 bill reconciliation. That number is reproduced locally by anyone holding
# their own data, via `scripts/reconcile_report.py`.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env is activated
    steps:
      - uses: actions/checkout@v4

      - name: Set up the documented conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest -q

      - name: Tariff specs must all load or raise deliberately
        # A spec with an UNVERIFIED field must raise at load time rather than bill a
        # guessed number. TOU-DR-P is deliberately unloadable; this asserts the gate is
        # doing its job rather than silently passing everything.
        run: python -c "import sys; sys.path.insert(0, 'src'); from tariffs.loader import SPECS_DIR; print(f'{len(list(SPECS_DIR.glob(\"*.yaml\")))} tariff specs present')"
